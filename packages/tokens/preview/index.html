<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canon Tokens Preview</title>
  <link rel="stylesheet" href="../dist/css/variables.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="preview">
    <header class="preview-header">
      <div>
        <h1 class="preview-title">Canon Tokens</h1>
        <p class="preview-subtitle">Figma primitive, semantic, typography</p>
      </div>
      <div class="theme-control" aria-label="테마 선택">
        <button type="button" data-theme-option="light">Light</button>
        <button type="button" data-theme-option="dark">Dark</button>
        <button type="button" data-theme-option="system" aria-pressed="true">System</button>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">Primitive colors</h2>
      <div id="primitive-list" class="scale-list"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Semantic colors</h2>
      <div id="semantic-groups" class="semantic-groups"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Typography</h2>
      <div id="typography-list" class="typography-list"></div>
    </section>
  </main>

  <script>
    const chromaticSteps = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950, 1000]
    const alphaSteps = ['alpha-100', 'alpha-200', 'alpha-300']
    const primitiveScales = [
      ...['red', 'orange', 'yellow', 'green', 'teal', 'cyan', 'blue', 'indigo', 'purple', 'pink']
        .map((name) => ({ name, steps: [...chromaticSteps, ...alphaSteps] })),
      { name: 'gray', steps: [...chromaticSteps, 1100] },
      { name: 'warm', steps: chromaticSteps },
      { name: 'white-alpha', label: 'whiteAlpha', steps: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900] },
      { name: 'black-alpha', label: 'blackAlpha', steps: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900] },
    ]

    const semanticGroups = {
      surface: ['body', 'default', 'raised', 'overlay', 'muted', 'inverse'],
      text: ['primary', 'secondary', 'tertiary', 'disabled', 'inverse', 'link'],
      icon: ['primary', 'secondary', 'disabled', 'inverse'],
      border: ['default', 'emphasis', 'focus', 'disabled'],
      neutral: ['solid', 'solid-hover', 'solid-pressed', 'subtle', 'on-solid', 'text', 'border'],
      overlay: ['hover', 'pressed', 'scrim'],
      static: ['white', 'black'],
      'status/informative': ['solid', 'solid-hover', 'solid-pressed', 'subtle', 'text', 'border', 'on-solid'],
      'status/positive': ['solid', 'solid-hover', 'solid-pressed', 'subtle', 'text', 'border', 'on-solid'],
      'status/notice': ['solid', 'solid-hover', 'solid-pressed', 'subtle', 'text', 'border', 'on-solid'],
      'status/negative': ['solid', 'solid-hover', 'solid-pressed', 'subtle', 'text', 'border', 'on-solid'],
    }

    const typographyStyles = [
      ['Display/60', 'display-60'],
      ['Display/48', 'display-48'],
      ['Heading/36', 'heading-36'],
      ['Heading/30', 'heading-30'],
      ['Heading/24', 'heading-24'],
      ['Heading/20', 'heading-20'],
      ['Body/18', 'body-18'],
      ['Body/18 Strong', 'body-18-strong'],
      ['Body/16', 'body-16'],
      ['Body/16 Strong', 'body-16-strong'],
      ['Body/14', 'body-14'],
      ['Body/14 Strong', 'body-14-strong'],
      ['Label/18', 'label-18'],
      ['Label/18 Strong', 'label-18-strong'],
      ['Label/16', 'label-16'],
      ['Label/16 Strong', 'label-16-strong'],
      ['Label/14', 'label-14'],
      ['Label/14 Strong', 'label-14-strong'],
      ['Label/12', 'label-12'],
      ['Label/12 Strong', 'label-12-strong'],
      ['Label/11', 'label-11'],
      ['Label/10', 'label-10'],
      ['Caption/12', 'caption-12'],
      ['Caption/11', 'caption-11'],
      ['Caption/10', 'caption-10'],
    ]

    const variableValue = (name) =>
      getComputedStyle(document.documentElement).getPropertyValue(name).trim()

    function renderPrimitives() {
      const list = document.getElementById('primitive-list')

      primitiveScales.forEach((scale) => {
        const row = document.createElement('article')
        row.className = 'scale-row'

        const name = document.createElement('h3')
        name.className = 'scale-name'
        name.textContent = scale.label ?? scale.name
        row.appendChild(name)

        const swatches = document.createElement('div')
        swatches.className = 'swatches'

        scale.steps.forEach((step) => {
          const item = document.createElement('div')
          item.className = 'swatch'

          const box = document.createElement('div')
          box.className = 'swatch-box'
          box.style.background = `var(--color-${scale.name}-${step})`

          const label = document.createElement('span')
          label.textContent = String(step).replace('alpha-', 'a')

          item.append(box, label)
          swatches.appendChild(item)
        })

        row.appendChild(swatches)
        list.appendChild(row)
      })
    }

    function renderSemantics() {
      const groups = document.getElementById('semantic-groups')
      groups.replaceChildren()

      Object.entries(semanticGroups).forEach(([group, names]) => {
        const section = document.createElement('article')
        section.className = 'semantic-group'

        const title = document.createElement('h3')
        title.className = 'group-title'
        title.textContent = group
        section.appendChild(title)

        const grid = document.createElement('div')
        grid.className = 'token-grid'

        names.forEach((name) => {
          const tokenPath = `${group}/${name}`
          const variable = `--semantic-${tokenPath.replaceAll('/', '-')}`
          const card = document.createElement('div')
          card.className = 'token-card'

          const swatch = document.createElement('div')
          swatch.className = 'token-swatch'
          swatch.style.background = `var(${variable})`

          const label = document.createElement('code')
          label.textContent = tokenPath

          const value = document.createElement('span')
          value.textContent = variableValue(variable)

          card.append(swatch, label, value)
          grid.appendChild(card)
        })

        section.appendChild(grid)
        groups.appendChild(section)
      })
    }

    function renderTypography() {
      const list = document.getElementById('typography-list')

      typographyStyles.forEach(([label, path]) => {
        const prefix = `--typography-${path}`
        const row = document.createElement('article')
        row.className = 'type-row'

        const metadata = document.createElement('div')
        metadata.className = 'type-metadata'
        metadata.innerHTML = `<strong>${label}</strong><code>${variableValue(`${prefix}-font-size`)} / ${variableValue(`${prefix}-line-height`)}</code>`

        const sample = document.createElement('p')
        sample.textContent = '가나다라마바사 Canon Design System'
        sample.style.fontFamily = `var(${prefix}-font-family)`
        sample.style.fontSize = `var(${prefix}-font-size)`
        sample.style.fontWeight = `var(${prefix}-font-weight)`
        sample.style.letterSpacing = `var(${prefix}-letter-spacing)`
        sample.style.lineHeight = `var(${prefix}-line-height)`

        row.append(metadata, sample)
        list.appendChild(row)
      })
    }

    document.querySelectorAll('[data-theme-option]').forEach((button) => {
      button.addEventListener('click', () => {
        const theme = button.dataset.themeOption

        if (theme === 'system') {
          document.documentElement.removeAttribute('data-theme')
        } else {
          document.documentElement.dataset.theme = theme
        }

        document.querySelectorAll('[data-theme-option]').forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button))
        })

        renderSemantics()
      })
    })

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!document.documentElement.dataset.theme) renderSemantics()
    })

    renderPrimitives()
    renderSemantics()
    renderTypography()
  </script>
</body>
</html>
